{% extends 'base.html' %}{% block content %}<h1>Nomination Management</h1>{% for n in rows %}<div class="card">
<div class="page-head">
    <div>
        <h3>{{n.candidate_name}} · {{n.election_title}}</h3>
        <p>{{n.manifesto}}</p>
        <span class="badge">{{n.status}}</span>
    </div>
    <form method="post" action="{{url_for('nomination_status',nid=n.id)}}">
        <select name="status">
            <option>Pending</option>
            <option>Approved</option>
            <option>Rejected</option>
        </select>
        <button class="btn small">Update</button>
    </form>
</div>
</div>{% endfor %}{% endblock %}
