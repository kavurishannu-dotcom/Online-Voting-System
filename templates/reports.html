{% extends 'base.html' %}{% block content %}<div class="page-head">
<h1>Reports & Analytics</h1>
<div>
    <a class="btn small" href="{{url_for('export_csv',kind='users')}}">Users CSV</a>
    <a class="btn small" href="{{url_for('export_csv',kind='elections')}}">Elections CSV</a>
    <a class="btn small" href="{{url_for('export_csv',kind='votes')}}">Votes CSV</a>
</div>
</div>
<div class="table-wrap">
    <table>
        <tr>
            <th>Election</th>
            <th>Status</th>
            <th>Total Votes</th>
        </tr>{% for r in rows %}<tr>
        <td>{{r.title}}</td>
        <td>{{r.status}}</td>
        <td>{{r.total_votes}}</td>
    </tr>{% endfor %}</table>
</div>{% endblock %}
