{% extends 'base.html' %}{% block content %}<h1>User Management</h1>
<div class="table-wrap">
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>
        </tr>{% for u in users %}<tr>
        <td>{{u.id}}</td>
        <td>{{u.name}}</td>
        <td>{{u.email}}</td>
        <td>{{u.role}}</td>
        <td>{{'Active' if u.is_active else 'Disabled'}}</td>
        <td>
            <form method="post" action="{{url_for('toggle_user',uid=u.id)}}">
                <button class="btn small">Toggle</button>
            </form>
        </td>
    </tr>{% endfor %}</table>
</div>{% endblock %}
