{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div class="auth card">
<h1>Create Account</h1>
<form method="post">
    <label>Name<input name="name" required>
    </label>
    <label>Email<input name="email" type="email" required>
    </label>
    <label>Phone<input name="phone">
    </label>
    <label>Role<select name="role">
        <option value="voter">Voter</option>
        <option value="candidate">Candidate</option>
    </select>
</label>
<label>Password<input name="password" type="password" minlength="8" required>
</label>
<button class="btn">Register</button>
</form>
</div>{% endblock %}
